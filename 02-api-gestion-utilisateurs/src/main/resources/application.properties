spring.application.name=api-gestion-utilisateurs

# Configuration PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5436/utilisateurs_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8082

# JWT (secret >= 256 bits recommande pour HS256). A remplacer en production via variable d'environnement.
app.jwt.secret=CHANGE_MOI_super_secret_key_jwt_pkfrc_projet_utilisateurs_2026
app.jwt.expiration-ms=86400000

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
