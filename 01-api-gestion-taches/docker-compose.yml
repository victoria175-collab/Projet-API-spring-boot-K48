services:
  postgres:
    image: postgres:16-alpine
    container_name: taches-postgres
    environment:
      POSTGRES_DB: taches_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - taches_pgdata:/var/lib/postgresql/data

volumes:
  taches_pgdata:
